<div class="panel">
  <header class="panel__header">
    <span class="panel__eyebrow">ChanceMachine</span>
    <app-menu
      (reset)="resetAll()"
      (openAbout)="aboutDialogRef.open()"
      (openChangelog)="changelogDialogRef.open()"
      (openFeedback)="feedbackDialogRef.open()"
    />
  </header>

  <app-pwa-install-banner />

  <div class="panel__body">
    <section class="console console--targets" aria-label="Targets">
      <div #targetList class="target-list">
        @for (target of targets(); track target.id; let i = $index; let count = $count) {
          <app-target-panel
            [target]="target"
            [index]="i"
            [count]="count"
            [removable]="count > 1"
            (openProfile)="targetProfileDialogRef.open(target.state)"
            (remove)="onRemoveTarget(target.id)"
          />
        }
      </div>

      <button type="button" class="add-target-btn" (click)="onAddTarget()">+ Add target</button>
    </section>

    <section class="console console--attacks" aria-label="Attack sequence">
      <div #attackerList class="attacker-list" cdkDropList (cdkDropListDropped)="onAttackerDrop($event)">
        @for (attacker of attackers(); track attacker.id; let i = $index; let count = $count) {
          <app-attacker-card
            cdkDrag
            [cdkDragData]="attacker"
            [attacker]="attacker"
            [index]="i"
            [removable]="count > 1"
            [targets]="targets()"
            (addAttack)="onAddAttack(attacker)"
            (editAttack)="attackEditDialogRef.open($event)"
            (removeAttack)="onRemoveAttack(attacker, $event)"
            (remove)="onRemoveAttacker(attacker.id)"
            (openRules)="attackerRulesDialogRef.open(attacker, i)"
          />
        }
      </div>

      <button type="button" class="add-attack-btn" (click)="onAddAttacker()">+ Add attacker</button>
    </section>

    <app-results-panel
      [results]="sequence()"
      [targetNames]="targetNames()"
      [averageDamageByTarget]="averageDamageByTarget()"
      [chanceToDestroyAll]="chanceToDestroyAll()"
      [calculating]="calculating()"
      [progress]="progress()"
      (showDetails)="detailsDialogRef.open($event)"
    />
  </div>

  <app-attack-edit-dialog #attackEditDialogRef [targets]="targets()" />

  <app-attacker-rules-dialog #attackerRulesDialogRef />

  <app-target-profile-dialog #targetProfileDialogRef />

  <app-details-dialog
    #detailsDialogRef
    [targetNames]="targetNames()"
    [shotRowsByTarget]="shotRowsByTarget()"
    [damagePointsByTarget]="damageDistributionPointsByTarget()"
    [maxDamageProbabilityByTarget]="maxDamageProbabilityByTarget()"
    [destroyChanceByTarget]="destroyChanceByTarget()"
    [averageDamageByTarget]="averageDamageByTarget()"
    [focusStrategySummaries]="focusStrategySummaries()"
  />

  <app-about-dialog #aboutDialogRef />

  <app-changelog-dialog #changelogDialogRef />

  <app-feedback-dialog #feedbackDialogRef />
</div>
