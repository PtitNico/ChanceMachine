<div class="panel">
  <header class="panel__header">
    <span class="panel__eyebrow">ChanceMachine</span>
    <app-menu
      (reset)="resetAll()"
      (openAbout)="aboutDialogRef.open()"
      (openChangelog)="changelogDialogRef.open()"
      (openFeedback)="feedbackDialogRef.open()"
    />
  </header>

  <div class="panel__body">
    <app-target-panel [target]="target" (openProfile)="targetProfileDialogRef.open()" />

    <section class="console console--attacks" aria-label="Attack sequence">
      <h2 class="console__title">Attack sequence</h2>

      <div class="attack-list">
        @for (row of rows(); track row.id; let i = $index; let count = $count) {
          <app-attack-row
            [row]="row"
            [index]="i"
            [removable]="count > 1"
            (openEffects)="effectsDialogRef.open(row)"
            (remove)="removeAttack(row.id)"
          />
        }
      </div>

      <button type="button" class="add-attack-btn" (click)="addAttack()">+ Add attack</button>
    </section>

    <app-results-panel
      [sequence]="sequence()"
      [boxesInitial]="target.boxes()"
      (showDetails)="detailsDialogRef.open()"
    />
  </div>

  <app-effects-dialog #effectsDialogRef />

  <app-target-profile-dialog #targetProfileDialogRef [target]="target" />

  <app-details-dialog
    #detailsDialogRef
    [steps]="sequence().steps"
    [damagePoints]="damageDistributionPoints()"
    [maxDamageProbability]="maxDamageProbability()"
  />

  <app-about-dialog #aboutDialogRef />

  <app-changelog-dialog #changelogDialogRef />

  <app-feedback-dialog #feedbackDialogRef />
</div>
