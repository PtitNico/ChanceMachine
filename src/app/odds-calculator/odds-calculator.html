<div class="panel">
  <header class="panel__header">
    <span class="panel__eyebrow">ChanceMachine</span>
    <app-menu
      (reset)="resetAll()"
      (openAbout)="aboutDialogRef.open()"
      (openChangelog)="changelogDialogRef.open()"
      (openFeedback)="feedbackDialogRef.open()"
    />
  </header>

  <app-pwa-install-banner />

  <div class="panel__body">
    <app-target-panel [target]="target" (openProfile)="targetProfileDialogRef.open()" />

    <section class="console console--attacks" aria-label="Attack sequence">
      <div #attackerList class="attacker-list" cdkDropList (cdkDropListDropped)="onAttackerDrop($event)">
        @for (attacker of attackers(); track attacker.id; let i = $index; let count = $count) {
          <app-attacker-card
            cdkDrag
            [cdkDragData]="attacker"
            [attacker]="attacker"
            [index]="i"
            [removable]="count > 1"
            (addAttack)="onAddAttack(attacker)"
            (editAttack)="attackEditDialogRef.open($event)"
            (removeAttack)="onRemoveAttack(attacker, $event)"
            (remove)="onRemoveAttacker(attacker.id)"
            (openRules)="attackerRulesDialogRef.open(attacker, i)"
          />
        }
      </div>

      <button type="button" class="add-attack-btn" (click)="onAddAttacker()">+ Add attacker</button>
    </section>

    <app-results-panel
      [sequence]="sequence()"
      [boxesInitial]="target.boxes()"
      [calculating]="calculating()"
      [progress]="progress()"
      (showDetails)="detailsDialogRef.open()"
    />
  </div>

  <app-attack-edit-dialog #attackEditDialogRef />

  <app-attacker-rules-dialog #attackerRulesDialogRef />

  <app-target-profile-dialog #targetProfileDialogRef [target]="target" />

  <app-details-dialog
    #detailsDialogRef
    [shotRows]="shotRows()"
    [damagePoints]="damageDistributionPoints()"
    [maxDamageProbability]="maxDamageProbability()"
  />

  <app-about-dialog #aboutDialogRef />

  <app-changelog-dialog #changelogDialogRef />

  <app-feedback-dialog #feedbackDialogRef />
</div>
