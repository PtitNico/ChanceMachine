<app-dialog-shell #shell title="Target profile" [framed]="true">
  @let t = target();
  <h3 class="dialog__section-title">Resources</h3>
  <div class="toggle-group">
    <app-toggle-select label="Focus" [signal]="t.focusPoints" [options]="resourceOptions" (valueChange)="onFocusChange(t, $event)" />
    <app-toggle-select label="Fury" [signal]="t.furyPoints" [options]="resourceOptions" (valueChange)="onFuryChange(t, $event)" />
  </div>

  <h3 class="dialog__section-title">Knowledge of the Damned</h3>
  <div class="toggle-group">
    <app-toggle-select
      label="Offensive"
      [signal]="t.offensiveKnowledgeOfTheDamned"
      [options]="kotdOptions"
      title="Offensive Knowledge of the Damned charges"
    />
    <app-toggle-select
      label="Defensive"
      [signal]="t.defensiveKnowledgeOfTheDamned"
      [options]="kotdOptions"
      title="Defensive Knowledge of the Damned charges"
    />
  </div>

  <h3 class="dialog__section-title">Shield Guard / Scapegoat</h3>
  <div class="toggle-group">
    <app-toggle-select
      label="Shield Guards"
      [signal]="t.shieldGuards"
      [options]="shieldGuardOptions"
      title="Shield Guards - blocks one ranged attack each"
    />
    <app-toggle-select
      label="Scapegoats"
      [signal]="t.scapegoats"
      [options]="scapegoatOptions"
      title="Scapegoats - blocks one melee attack each"
    />
  </div>

  <h3 class="dialog__section-title">Special rules</h3>
  <div class="toggle-group">
    <button
      type="button"
      class="toggle-btn"
      [class.toggle-btn--active]="t.toughKind() === 'tough'"
      (click)="toggleToughKind(t, 'tough')"
    >
      Tough
    </button>
    <button
      type="button"
      class="toggle-btn"
      [class.toggle-btn--active]="t.toughKind() === 'toughSteady'"
      (click)="toggleToughKind(t, 'toughSteady')"
    >
      Tough Steady
    </button>
    <app-toggle-select
      label="Shield"
      [signal]="t.shieldAmount"
      [options]="shieldAmountOptions"
      [formatValue]="formatBonus"
      title="Shield - flat ARM bonus"
    />
    <button type="button" class="toggle-btn" [class.toggle-btn--active]="t.unyielding()" (click)="toggleUnyielding(t)">
      Unyielding
    </button>
    <button
      type="button"
      class="toggle-btn"
      [class.toggle-btn--active]="t.carapace()"
      (click)="t.carapace.set(!t.carapace())"
    >
      Carapace
    </button>
    <button
      type="button"
      class="toggle-btn"
      [class.toggle-btn--active]="t.rapidHealing()"
      (click)="t.rapidHealing.set(!t.rapidHealing())"
    >
      Rapid Healing
    </button>
  </div>

  <h3 class="dialog__section-title">Dispellable special rules</h3>
  <div class="toggle-group">
    <button
      type="button"
      class="toggle-btn"
      [class.toggle-btn--active]="t.dispellableUnyielding()"
      (click)="toggleDispellableUnyielding(t)"
    >
      Unyielding
    </button>
    <button type="button" class="toggle-btn" [class.toggle-btn--active]="t.dispellableTough()" (click)="toggleDispellableTough(t)">
      Tough
    </button>
  </div>

  <h3 class="dialog__section-title">Upkeep spells / Animi</h3>
  <div class="toggle-group">
    <app-toggle-select
      label="DEF"
      [signal]="t.upkeepSpellDefAmount"
      [options]="spellBonusOptions"
      [formatValue]="formatBonus"
      [formatActive]="formatStatActive"
      title="Upkeep spell / Animus DEF bonus"
    />
    <app-toggle-select
      label="ARM"
      [signal]="t.upkeepSpellArmAmount"
      [options]="spellBonusOptions"
      [formatValue]="formatBonus"
      [formatActive]="formatStatActive"
      title="Upkeep spell / Animus ARM bonus"
    />
  </div>

  <h3 class="dialog__section-title">Spells</h3>
  <div class="toggle-group">
    <app-toggle-select
      label="DEF"
      [signal]="t.spellDefAmount"
      [options]="spellBonusOptions"
      [formatValue]="formatBonus"
      [formatActive]="formatStatActive"
      title="Spell DEF bonus"
    />
    <app-toggle-select
      label="ARM"
      [signal]="t.spellArmAmount"
      [options]="spellBonusOptions"
      [formatValue]="formatBonus"
      [formatActive]="formatStatActive"
      title="Spell ARM bonus"
    />
  </div>

  <div dialogActions class="dialog__actions">
    <button type="button" class="dialog__reset-btn" (click)="resetProfile(t)">Reset</button>
    <button type="button" class="dialog__done-btn" (click)="shell.close()">Done</button>
  </div>
</app-dialog-shell>
