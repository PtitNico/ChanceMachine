<app-dialog-shell #shell title="Target profile" [framed]="true">
  @let t = target();
  <h3 class="dialog__section-title">Resources</h3>
  <div class="toggle-group">
    <app-toggle-select label="Focus" [signal]="t.focusPoints" [options]="resourceOptions" (valueChange)="onFocusChange(t, $event)" />
    <app-toggle-select label="Fury" [signal]="t.furyPoints" [options]="resourceOptions" (valueChange)="onFuryChange(t, $event)" />
  </div>

  <h3 class="dialog__section-title">Knowledge of the Damned</h3>
  <div class="toggle-group">
    <app-toggle-select
      label="Offensive"
      [signal]="t.offensiveKnowledgeOfTheDamned"
      [options]="kotdOptions"
      title="Offensive Knowledge of the Damned charges"
    />
    <app-toggle-select
      label="Defensive"
      [signal]="t.defensiveKnowledgeOfTheDamned"
      [options]="kotdOptions"
      title="Defensive Knowledge of the Damned charges"
    />
  </div>

  <h3 class="dialog__section-title">Shield Guard / Scapegoat</h3>
  <div class="toggle-group">
    <app-toggle-select
      label="Shield Guards"
      [signal]="t.shieldGuards"
      [options]="shieldGuardOptions"
      title="Shield Guards - blocks one ranged attack each"
    />
    <app-toggle-select
      label="Scapegoats"
      [signal]="t.scapegoats"
      [options]="scapegoatOptions"
      title="Scapegoats - blocks one melee attack each"
    />
  </div>

  <h3 class="dialog__section-title">Special rules</h3>
  <div class="toggle-group">
    <button
      type="button"
      class="toggle-btn"
      [class.toggle-btn--active]="t.toughKind() === 'tough'"
      (click)="toggleToughKind(t, 'tough')"
    >
      Tough
    </button>
    <button
      type="button"
      class="toggle-btn"
      [class.toggle-btn--active]="t.toughKind() === 'toughSteady'"
      (click)="toggleToughKind(t, 'toughSteady')"
    >
      Tough Steady
    </button>
    <app-toggle-select
      label="Shield"
      [signal]="t.shieldAmount"
      [options]="shieldAmountOptions"
      [formatValue]="formatArmBonus"
      title="Shield - flat ARM bonus"
    />
    <button
      type="button"
      class="toggle-btn"
      [class.toggle-btn--active]="t.unyielding()"
      (click)="t.unyielding.set(!t.unyielding())"
    >
      Unyielding
    </button>
    <button
      type="button"
      class="toggle-btn"
      [class.toggle-btn--active]="t.carapace()"
      (click)="t.carapace.set(!t.carapace())"
    >
      Carapace
    </button>
    <button
      type="button"
      class="toggle-btn"
      [class.toggle-btn--active]="t.rapidHealing()"
      (click)="t.rapidHealing.set(!t.rapidHealing())"
    >
      Rapid Healing
    </button>
  </div>

  <h3 class="dialog__section-title">Custom effects</h3>
  @for (spell of t.spellBonuses(); track spell.id) {
    <div class="spell-row">
      <div class="spell-row__line">
        <app-editable-name [nameSignal]="spell.name" placeholder="Name" ariaLabel="Effect name" />
        <button
          type="button"
          class="icon-btn icon-btn--trash spell-row__remove"
          (click)="removeSpellBonus(t, spell.id)"
          aria-label="Remove spell bonus"
        >
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>
      <div class="spell-row__line">
        @if (spell.kind() === 'stat') {
          <select
            class="field__select field__select--narrow"
            title="Bonus amount"
            [ngModel]="spell.statAmount()"
            (ngModelChange)="spell.statAmount.set(toNumber($event))"
          >
            @for (v of spellBonusOptions; track v) {
              <option [value]="v">+{{ v }}</option>
            }
          </select>
          <select
            class="field__select field__select--narrow"
            title="Bonus stat"
            [ngModel]="spell.statType()"
            (ngModelChange)="spell.statType.set($event)"
          >
            <option value="def">DEF</option>
            <option value="arm">ARM</option>
          </select>
          <button
            type="button"
            class="toggle-btn toggle-btn--sm"
            [class.toggle-btn--active]="spell.isSpell()"
            title="Spell - ignored by an attack's Blessed effect"
            (click)="spell.isSpell.set(!spell.isSpell())"
          >
            Spell
          </button>
          <button
            type="button"
            class="toggle-btn toggle-btn--sm"
            [class.toggle-btn--active]="spell.dispellable()"
            title="Dispellable - removed by an attack's Dispel effect"
            (click)="spell.dispellable.set(!spell.dispellable())"
          >
            Dispellable
          </button>
        } @else {
          <select
            class="field__select field__select--narrow"
            title="Granted rule"
            [ngModel]="spell.ruleKind()"
            (ngModelChange)="spell.ruleKind.set($event)"
          >
            @for (r of spellRuleOptions; track r) {
              <option [value]="r">{{ spellRuleLabels[r] }}</option>
            }
          </select>
        }
      </div>
    </div>
  }
  <div class="spell-add-buttons">
    <button type="button" class="add-spell-btn" (click)="addDispellableEffect(t)">+ Add dispellable effect</button>
    <button type="button" class="add-spell-btn" (click)="addStatSpell(t)">+ Add stat spell</button>
  </div>

  <div dialogActions class="dialog__actions">
    <button type="button" class="dialog__reset-btn" (click)="resetProfile(t)">Reset</button>
    <button type="button" class="dialog__done-btn" (click)="shell.close()">Done</button>
  </div>
</app-dialog-shell>
