<app-dialog-shell #shell title="Changelog">
  <div class="changelog">
    @for (entry of entries; track entry.date) {
      <section class="changelog__entry">
        <h3 class="changelog__date">{{ entry.date }}</h3>
        <ul class="changelog__items">
          @for (item of entry.items; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      </section>
    }
  </div>
</app-dialog-shell>
