<div class="target-card">
  <div class="target-card__header">
    <app-editable-name
      [nameSignal]="target().name"
      [placeholder]="count() > 1 ? 'Target ' + (index() + 1) : 'Target'"
      ariaLabel="Target name"
    />

    <app-mini-field-select label="DEF" [signal]="target().state.def" [options]="defOptions" [parse]="parseDef" />
    <app-mini-field-select label="ARM" [signal]="target().state.arm" [options]="armOptions" [parse]="toNumber" />
    <app-mini-field-select label="Boxes" [signal]="target().state.boxes" [options]="boxesOptions" [parse]="toNumber" />

    <button type="button" class="icon-btn icon-btn--settings" (click)="openProfile.emit()" aria-label="Target profile">
      <span class="material-symbols-outlined">settings</span>
    </button>

    <button
      type="button"
      class="icon-btn icon-btn--trash"
      (click)="remove.emit()"
      [disabled]="!removable()"
      aria-label="Remove target"
    >
      <span class="material-symbols-outlined">delete</span>
    </button>
  </div>

  <app-effect-tags [tags]="targetSummary(target().state)" />
</div>
