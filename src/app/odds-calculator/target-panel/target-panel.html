<section class="console" aria-label="Target">
  <h2 class="console__title">Target</h2>

  <div class="target-row">
    <label class="mini-field">
      <span class="mini-field__label">DEF</span>
      <select
        class="mini-field__input mini-field__input--select"
        [ngModel]="target().def()"
        (ngModelChange)="target().def.set(parseDef($event))"
      >
        @for (v of defOptions; track v) {
          <option [value]="v">{{ v }}</option>
        }
      </select>
    </label>

    <label class="mini-field">
      <span class="mini-field__label">ARM</span>
      <select
        class="mini-field__input mini-field__input--select"
        [ngModel]="target().arm()"
        (ngModelChange)="target().arm.set(toNumber($event))"
      >
        @for (v of armOptions; track v) {
          <option [value]="v">{{ v }}</option>
        }
      </select>
    </label>

    <label class="mini-field">
      <span class="mini-field__label">Boxes</span>
      <select
        class="mini-field__input mini-field__input--select"
        [ngModel]="target().boxes()"
        (ngModelChange)="target().boxes.set(toNumber($event))"
      >
        @for (v of boxesOptions; track v) {
          <option [value]="v">{{ v }}</option>
        }
      </select>
    </label>

    <button type="button" class="icon-btn" (click)="openProfile.emit()" aria-label="Target profile">⚙</button>
  </div>

  @if (targetSummary(target()).length > 0) {
    <div class="effect-tags">
      @for (label of targetSummary(target()); track label) {
        <span class="effect-tag">{{ label }}</span>
      }
    </div>
  }
</section>
