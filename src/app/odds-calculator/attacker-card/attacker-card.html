<div class="attacker-card">
  <div class="attacker-card__header">
    <span class="drag-handle" cdkDragHandle aria-label="Drag to reorder attacker">
      <span class="material-symbols-outlined">drag_indicator</span>
    </span>

    <div class="attacker-card__name-row">
      <span
        #nameSpan
        class="attacker-card__name"
        contenteditable="true"
        role="textbox"
        aria-label="Attacker name"
        [attr.data-placeholder]="'Attacker ' + (index() + 1)"
        (blur)="onNameBlur(nameSpan)"
        (keydown.enter)="$event.preventDefault(); nameSpan.blur()"
      ></span>
    </div>

    @if (presentTypes().has('melee')) {
      <app-mini-field-select label="MAT" [signal]="attacker().mat" [options]="statOptions" [parse]="toNumber" />
    }
    @if (presentTypes().has('ranged')) {
      <app-mini-field-select label="RAT" [signal]="attacker().rat" [options]="statOptions" [parse]="toNumber" />
    }
    @if (presentTypes().has('arcane')) {
      <app-mini-field-select label="AAT" [signal]="attacker().aat" [options]="statOptions" [parse]="toNumber" />
    }

    <button type="button" class="icon-btn icon-btn--settings" (click)="openRules.emit()" aria-label="Attacker special rules">
      <span class="material-symbols-outlined">settings</span>
    </button>

    <button
      type="button"
      class="icon-btn icon-btn--trash"
      (click)="remove.emit()"
      [disabled]="!removable()"
      aria-label="Remove attacker"
    >
      <span class="material-symbols-outlined">delete</span>
    </button>
  </div>

  <app-effect-tags [tags]="attackerRulesSummary(attacker())" />

  <div class="attacker-card__attacks" cdkDropList (cdkDropListDropped)="onAttackDrop($event)">
    @for (row of attacker().attacks(); track row.id; let count = $count) {
      <app-attack-sub-card
        cdkDrag
        [cdkDragData]="row"
        [row]="row"
        [removable]="count > 1"
        (edit)="editAttack.emit(row)"
        (remove)="removeAttack.emit(row.id)"
      />
    }
  </div>

  <button #addAttackBtn type="button" class="attacker-card__add-attack-btn" (click)="onAddAttack()">+ Add attack</button>
</div>
