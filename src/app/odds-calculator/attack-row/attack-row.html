<div class="attack-row-group">
  <div class="attack-row">
    <span class="attack-row__index">{{ index() + 1 }}</span>

    <app-mini-field-select label="Type" [signal]="row().type" [options]="attackTypes" />
    <app-mini-field-select
      [label]="statLabel(row().type())"
      [signal]="row().stat"
      [options]="statOptions"
      [parse]="toNumber"
      [narrow]="true"
    />
    <app-mini-field-select label="Dice" [signal]="row().diceCount" [options]="diceOptions" [parse]="toNumber" [narrow]="true" />
    <app-mini-field-select label="POW" [signal]="row().pow" [options]="powOptions" [parse]="parsePow" [narrow]="true" />
    <app-mini-field-select
      label="Dice"
      [signal]="row().damageDiceCount"
      [options]="diceOptions"
      [parse]="toNumber"
      [narrow]="true"
    />

    <button type="button" class="icon-btn" (click)="openEffects.emit()" aria-label="Effects">⚙</button>

    <button
      type="button"
      class="icon-btn icon-btn--danger"
      (click)="remove.emit()"
      [disabled]="!removable()"
      aria-label="Remove attack"
    >
      ✕
    </button>
  </div>
  <app-effect-tags [tags]="effectsSummary(row())" />
</div>
