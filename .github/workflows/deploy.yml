name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch: # permet aussi de le déclencher manuellement depuis l'onglet Actions

permissions:
  contents: write
  pages: write
  id-token: write

# Évite que deux déploiements se chevauchent si tu pushes deux fois rapidement.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Finalize changelog date
        id: changelog
        run: node scripts/finalize-changelog.js

      - name: Commit finalized changelog
        if: steps.changelog.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/app/odds-calculator/changelog-dialog/changelog.data.ts
          git commit -m "chore: finalize changelog date [skip ci]"
          git push

      - name: Build (production)
        run: npx ng build --configuration production --base-href /ChanceMachine/

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ChanceMachine/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
